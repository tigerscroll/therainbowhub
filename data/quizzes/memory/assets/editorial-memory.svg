<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Editorial memory challenge artwork</title>
  <desc id="desc">A vintage test sheet with a brain maze, recall cards and an 80 percent challenge seal.</desc>
  <defs>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#292620" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2b2018" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="720" height="720" fill="#d9d0bd"/>
  <rect width="720" height="720" fill="url(#grid)"/>
  <g transform="rotate(-3 360 360)" filter="url(#shadow)">
    <rect x="92" y="62" width="536" height="600" rx="8" fill="#fff8e8" stroke="#201e1a" stroke-width="4"/>
    <path d="M126 126H594M126 174H480M126 545H594" stroke="#201e1a" stroke-width="3"/>
    <text x="126" y="112" fill="#a82c32" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="4">MEMORY TEST</text>
    <text x="126" y="158" fill="#201e1a" font-family="Georgia, serif" font-size="20" font-weight="700">LOOK. HOLD. RECALL.</text>
    <g transform="translate(158 218)" fill="none" stroke="#201e1a" stroke-linecap="round" stroke-linejoin="round">
      <path d="M202 2c-55 0-100 37-100 84-38 9-64 39-64 75 0 31 19 57 47 70-3 12-4 24-1 37 7 31 33 54 65 59 15 30 44 50 78 50 29 0 55-14 71-36 42-1 76-31 80-70 23-17 37-44 34-72-3-31-25-58-56-68-4-49-47-88-100-88-16-25-45-41-74-41Z" stroke-width="9"/>
      <path d="M207 44v284M207 93c-45-24-81 4-81 36m81 26c-48-11-72 19-67 50m67 20c-35 6-51 31-44 58m44-164c38-21 73 2 74 32m-74 40c52-17 88 12 84 47m-84 35c42-4 69 20 67 51" stroke-width="8"/>
      <circle cx="207" cy="44" r="9" fill="#a82c32" stroke="none"/>
      <circle cx="126" cy="129" r="8" fill="#a82c32" stroke="none"/>
      <circle cx="291" cy="238" r="8" fill="#a82c32" stroke="none"/>
      <circle cx="163" cy="283" r="8" fill="#a82c32" stroke="none"/>
    </g>
    <g transform="translate(126 574)">
      <rect width="105" height="54" fill="#201e1a"/>
      <text x="52" y="35" fill="#fff8e8" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900">10 ROUNDS</text>
      <rect x="119" width="174" height="54" fill="#a82c32"/>
      <text x="206" y="35" fill="#fff8e8" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="900">80% PASS LINE</text>
    </g>
  </g>
  <g transform="translate(505 42) rotate(8)">
    <circle cx="82" cy="82" r="78" fill="#a82c32" stroke="#fff8e8" stroke-width="8"/>
    <circle cx="82" cy="82" r="62" fill="none" stroke="#fff8e8" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="82" y="72" fill="#fff8e8" text-anchor="middle" font-family="Georgia, serif" font-size="43" font-weight="900">80%</text>
    <text x="82" y="101" fill="#fff8e8" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2">CHALLENGE</text>
  </g>
</svg>
