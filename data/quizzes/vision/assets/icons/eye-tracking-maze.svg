<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Solid-line eye-tracking maze</title>
  <desc id="desc">A solid line starts at a red dot, crosses several dashed lines and ends at the endpoint labelled C.</desc>
  <rect width="640" height="300" rx="28" fill="#f7fbfd"/>
  <g fill="none" stroke="#8ea7b8" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 15" opacity=".8">
    <path d="M82 62 C190 42 248 132 356 92 S510 34 580 58"/>
    <path d="M86 226 C190 278 286 186 376 228 S510 284 580 244"/>
    <path d="M164 30 C210 98 152 188 212 270"/>
  </g>
  <path d="M62 150 C126 150 116 88 190 88 S268 212 348 212 S424 130 486 130 S530 186 580 186" fill="none" stroke="#102f55" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="62" cy="150" r="18" fill="#e15361" stroke="#fff" stroke-width="6"/>
  <g font-family="Arial, sans-serif" font-size="32" font-weight="800" text-anchor="middle" fill="#102f55">
    <g><circle cx="594" cy="58" r="24" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="594" y="69">A</text></g>
    <g><circle cx="594" cy="122" r="24" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="594" y="133">B</text></g>
    <g><circle cx="594" cy="186" r="24" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="594" y="197">C</text></g>
    <g><circle cx="594" cy="250" r="24" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="594" y="261">D</text></g>
  </g>
</svg>
