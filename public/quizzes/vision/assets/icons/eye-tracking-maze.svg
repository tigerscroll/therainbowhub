<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc">
  <title id="title">Dotted-route eye-tracking maze</title>
  <desc id="desc">Four matching dotted routes cross repeatedly. The route beginning at the red dot ends at C.</desc>
  <rect width="720" height="410" rx="30" fill="#f7fbfd"/>
  <path d="M82 70 C190 70 180 220 290 220 S390 70 500 70 S600 70 670 70" fill="none" stroke="#91a9b9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>
  <path d="M82 340 C174 340 180 165 276 165 S390 320 500 320 S590 160 670 160" fill="none" stroke="#91a9b9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>
  <path d="M88 145 C178 145 190 300 286 300 S400 190 492 190 S590 340 670 340" fill="none" stroke="#91a9b9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>
  <path d="M62 210 C120 210 130 115 190 115 S250 270 320 270 S400 135 470 135 S560 250 670 250" fill="none" stroke="#91a9b9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 16"/>
  <circle cx="62" cy="210" r="18" fill="#e15361" stroke="#fff" stroke-width="6"/>
  <g font-family="Arial, sans-serif" font-size="30" font-weight="800" text-anchor="middle" fill="#102f55">
    <g><circle cx="688" cy="70" r="23" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="688" y="80">A</text></g>
    <g><circle cx="688" cy="160" r="23" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="688" y="170">B</text></g>
    <g><circle cx="688" cy="250" r="23" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="688" y="260">C</text></g>
    <g><circle cx="688" cy="340" r="23" fill="#fff" stroke="#31b9d0" stroke-width="4"/><text x="688" y="350">D</text></g>
  </g>
</svg>
